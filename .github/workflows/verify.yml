name: Verify website
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Ensure generated pages are current
        run: git diff --exit-code -- index.html research/index.html publications/index.html cv/index.html library/index.html about/index.html 404.html mini_lib/index.html sitemap.xml robots.txt
