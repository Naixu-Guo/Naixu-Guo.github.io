# Jekyll configuration
title: "Naixu Guo"
description: "Quantum algorithms, structured learning, and scientific discovery."
author: "Naixu Guo"
email: "naixug@u.nus.edu"
url: "https://naixu-guo.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:title/
  talks:
    output: true
    permalink: /talks/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github

# Include
include:
  - _pages
  - _data
